name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Generate Allen cache smoke fixture
        run: uv run python tests/load_testdata.py --cell-ids 525011903

      - name: Run vendored Allen tests
        run: uv run python -m pytest tests/allen_ephys/test_allen_features.py tests/allen_ephys/test_allen_extractor.py -vv

      - name: Prune uv cache
        run: uv cache prune --ci
