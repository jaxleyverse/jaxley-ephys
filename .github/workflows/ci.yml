name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv sync --group dev
          uv pip install pytest

      - name: Generate Allen cache smoke fixture
        run: |
          uv run python tests/utils/load_allen_testcases.py --cell-ids 525011903

      - name: Run stable Allen feature tests
        run: |
          uv run python -m pytest -W error tests/allen_ephys_tests/test_features.py -vv
