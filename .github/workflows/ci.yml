name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked  # includes the dev dependency group

      - name: Lint
        run: uv run ruff check jaxley_ephys tests

      - name: Download Allen test specimen
        run: uv run python tests/load_testdata.py --cell-ids 525011903

      - name: Build Allen reference
        run: uv run python tests/build_reference.py

      - name: Run tests (including the vendored Allen code)
        run: uv run python -m pytest -q -rfxX --allen

      - name: Prune uv cache
        run: uv cache prune --ci
